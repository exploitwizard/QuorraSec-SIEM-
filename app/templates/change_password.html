<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courra-Sec - Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            width: 100%;
            max-width: 420px;
            padding: 2rem;
        }
        .card-header { color: #fff; font-weight: bold; font-size: 1.3rem; text-align: center; margin-bottom: 1.5rem; }
        .form-label  { color: rgba(255,255,255,0.85); }
        .form-control {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.15);
            border-color: #0d6efd;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13,110,253,0.25);
        }
        .form-control::placeholder { color: rgba(255,255,255,0.4); }
        .btn-primary { background: linear-gradient(135deg,#0d6efd,#0a58ca); border: none; width: 100%; padding: .75rem; font-weight: bold; }
        .btn-primary:hover { background: linear-gradient(135deg,#0a58ca,#084298); }
        .alert-danger  { background: rgba(220,53,69,.2); border-color: rgba(220,53,69,.3); color: #ff6b6b; }
        .alert-warning { background: rgba(255,193,7,.15); border-color: rgba(255,193,7,.3); color: #ffc107; }
        .strength-bar { height: 4px; border-radius: 2px; transition: width .3s, background .3s; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <i class="fas fa-key me-2"></i>
        {% if required %}Set a New Password{% else %}Change Password{% endif %}
    </div>

    {% if required %}
    <div class="alert alert-warning mb-3">
        <i class="fas fa-exclamation-triangle me-2"></i>
        You must set a new password before continuing.
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger mb-3">
        <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('change_password') }}" id="pwForm">
        <div class="mb-3">
            <label class="form-label"><i class="fas fa-lock me-2"></i>Current Password</label>
            <input type="password" class="form-control" name="current_password"
                   placeholder="Current password" required autocomplete="current-password">
        </div>

        <div class="mb-3">
            <label class="form-label"><i class="fas fa-lock me-2"></i>New Password</label>
            <input type="password" class="form-control" name="new_password" id="newPw"
                   placeholder="At least 8 characters" required minlength="8"
                   autocomplete="new-password">
            <div class="mt-1">
                <div class="strength-bar" id="strengthBar" style="width:0;background:#dc3545;"></div>
            </div>
            <small id="strengthLabel" style="color:rgba(255,255,255,0.5);"></small>
        </div>

        <div class="mb-4">
            <label class="form-label"><i class="fas fa-lock me-2"></i>Confirm New Password</label>
            <input type="password" class="form-control" name="confirm_password" id="confirmPw"
                   placeholder="Repeat new password" required minlength="8"
                   autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Update Password
        </button>
    </form>

    {% if not required %}
    <div class="text-center mt-3">
        <a href="{{ url_for('dashboard') }}" style="color:rgba(255,255,255,0.5);font-size:.85rem;">
            <i class="fas fa-arrow-left me-1"></i>Back to dashboard
        </a>
    </div>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const newPw      = document.getElementById('newPw');
    const confirmPw  = document.getElementById('confirmPw');
    const bar        = document.getElementById('strengthBar');
    const label      = document.getElementById('strengthLabel');

    function scorePassword(pw) {
        let s = 0;
        if (pw.length >= 8)  s++;
        if (pw.length >= 12) s++;
        if (/[A-Z]/.test(pw)) s++;
        if (/[0-9]/.test(pw)) s++;
        if (/[^A-Za-z0-9]/.test(pw)) s++;
        return s;
    }

    newPw.addEventListener('input', function() {
        const score  = scorePassword(this.value);
        const widths = ['0%','20%','40%','60%','80%','100%'];
        const colors = ['#dc3545','#dc3545','#ffc107','#0dcaf0','#198754','#198754'];
        const labels = ['','Very weak','Weak','Fair','Strong','Very strong'];
        bar.style.width      = widths[score];
        bar.style.background = colors[score];
        label.textContent    = labels[score];
    });

    confirmPw.addEventListener('input', function() {
        this.style.borderColor = this.value === newPw.value
            ? 'rgba(25,135,84,.8)' : 'rgba(220,53,69,.8)';
    });
</script>
</body>
</html>
