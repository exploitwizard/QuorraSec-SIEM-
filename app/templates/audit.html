<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Courra-Sec — Audit Log</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0d0d1a 0%,#111827 100%);color:#e5e7eb;min-height:100vh;font-family:'Segoe UI',sans-serif;}
.navbar{background:#0a0a14!important;border-bottom:1px solid rgba(99,102,241,.25);}
.nav-link{color:rgba(255,255,255,.65)!important;font-size:.85rem;}.nav-link:hover,.nav-link.active{color:#a78bfa!important;}
.g-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;margin-bottom:16px;}
.sec-head{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#6b7280;margin-bottom:6px;font-weight:600;}
.form-control,.form-select{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;color:#e5e7eb!important;font-size:.82rem;}
.form-select option{background:#1f2937;}
.action-badge{padding:2px 8px;border-radius:99px;font-size:.65rem;font-weight:600;}
.ab-login{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.25);}
.ab-delete{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.25);}
.ab-create{background:rgba(6,182,212,.15);color:#67e8f9;border:1px solid rgba(6,182,212,.25);}
.ab-update{background:rgba(234,179,8,.15);color:#fde68a;border:1px solid rgba(234,179,8,.25);}
.ab-default{background:rgba(107,114,128,.15);color:#9ca3af;border:1px solid rgba(107,114,128,.25);}
</style>
</head>
<body>
<nav class="navbar navbar-dark">
<div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-shield-alt me-2" style="color:#a78bfa"></i>COURRA-SEC SIEM</a>
    <div class="navbar-nav flex-row align-items-center ms-auto gap-1">
        <span class="text-secondary me-2" style="font-size:.8rem"><i class="fas fa-user-circle me-1"></i>{{ username }}</span>
        <a class="nav-link px-2" href="/dashboard">Dashboard</a>
        <a class="nav-link px-2" href="/reports">Reports</a>
        <a class="nav-link active px-2" href="/audit"><i class="fas fa-clipboard-list me-1"></i>Audit</a>
        <a class="nav-link px-2 text-warning" href="/logout">Logout</a>
    </div>
</div>
</nav>

<div class="container-fluid py-4 px-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h1 class="h4 mb-0"><i class="fas fa-clipboard-list me-2" style="color:#a78bfa"></i>Audit Log</h1>
        <p class="text-secondary mb-0" style="font-size:.8rem">Full record of all administrative and security actions</p>
    </div>
    <a href="/api/reports/export/audit?format=csv" class="btn btn-sm btn-outline-secondary"><i class="fas fa-download me-1"></i>Export CSV</a>
</div>

<!-- Filters -->
<div class="g-card py-3">
    <div class="row g-2 align-items-end">
        <div class="col-6 col-md-3">
            <label class="sec-head">Filter by Action</label>
            <input type="text" class="form-control form-control-sm" id="actionFilter" placeholder="e.g. login, rule_created">
        </div>
        <div class="col-6 col-md-3">
            <label class="sec-head">Filter by User</label>
            <input type="text" class="form-control form-control-sm" id="userFilter" placeholder="username">
        </div>
        <div class="col-6 col-md-2">
            <button class="btn btn-sm btn-primary w-100" onclick="loadAudit(1)"><i class="fas fa-filter me-1"></i>Filter</button>
        </div>
        <div class="col-6 col-md-2">
            <button class="btn btn-sm btn-outline-secondary w-100" onclick="clearFilters()">Clear</button>
        </div>
    </div>
</div>

<div class="g-card" style="padding:0;overflow:hidden">
<table class="table table-sm mb-0" style="font-size:.78rem">
<thead style="background:rgba(255,255,255,.04)"><tr class="text-secondary">
    <th class="px-3 py-2">Time</th><th>User</th><th>Action</th><th>Resource</th><th>IP</th><th>Details</th>
</tr></thead>
<tbody id="auditTbody">
    <tr><td colspan="6" class="text-center py-4 text-secondary"><div class="spinner-border spinner-border-sm"></div></td></tr>
</tbody>
</table>
</div>

<!-- Pagination -->
<div class="d-flex justify-content-between align-items-center mt-2">
    <small class="text-secondary" id="pageInfo"></small>
    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="changePage(-1)"><i class="fas fa-chevron-left"></i></button>
        <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="changePage(1)"><i class="fas fa-chevron-right"></i></button>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let currentPage = 1, totalPages = 1;

function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function actionClass(action) {
    if(!action) return 'ab-default';
    if(action.includes('login')) return 'ab-login';
    if(action.includes('delete') || action.includes('remov') || action.includes('suspend')) return 'ab-delete';
    if(action.includes('creat') || action.includes('invit') || action.includes('import')) return 'ab-create';
    if(action.includes('updat') || action.includes('chang') || action.includes('regen')) return 'ab-update';
    return 'ab-default';
}

function loadAudit(page) {
    currentPage = page;
    const action = document.getElementById('actionFilter').value.trim();
    const user   = document.getElementById('userFilter').value.trim();
    let url = `/api/audit?page=${page}&per_page=50`;
    if(action) url += `&action=${encodeURIComponent(action)}`;
    if(user)   url += `&username=${encodeURIComponent(user)}`;

    fetch(url).then(r=>r.json()).then(data => {
        totalPages = data.pages || 1;
        document.getElementById('pageInfo').textContent = `Page ${page} of ${totalPages} (${data.total} total)`;
        document.getElementById('prevBtn').disabled = page <= 1;
        document.getElementById('nextBtn').disabled = page >= totalPages;

        if(!data.items.length) {
            document.getElementById('auditTbody').innerHTML = '<tr><td colspan="6" class="text-center py-4 text-secondary">No audit entries found</td></tr>';
            return;
        }

        document.getElementById('auditTbody').innerHTML = data.items.map(e => `
        <tr>
            <td class="px-3 text-secondary">${e.created_at ? e.created_at.substring(0,19).replace('T',' ') : '—'}</td>
            <td><code style="font-size:.72rem;color:#a78bfa">${escHtml(e.username||'system')}</code></td>
            <td><span class="action-badge ${actionClass(e.action)}">${escHtml(e.action||'')}</span></td>
            <td class="text-secondary">${escHtml(e.resource_type||'')} ${e.resource_id ? '#'+escHtml(e.resource_id) : ''}</td>
            <td class="text-secondary">${escHtml(e.ip_address||'—')}</td>
            <td>
                ${e.details ? `<button class="btn btn-sm p-0 text-secondary" onclick="showDetails('${escHtml(e.details.replace(/'/g,'&apos;'))}')"><i class="fas fa-info-circle"></i></button>` : '—'}
            </td>
        </tr>`).join('');
    });
}

function changePage(d) {
    const np = currentPage + d;
    if(np < 1 || np > totalPages) return;
    loadAudit(np);
}

function clearFilters() {
    document.getElementById('actionFilter').value = '';
    document.getElementById('userFilter').value = '';
    loadAudit(1);
}

function showDetails(jsonStr) {
    try {
        const parsed = JSON.parse(jsonStr.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'"));
        alert(JSON.stringify(parsed, null, 2));
    } catch(e) {
        alert(jsonStr);
    }
}

document.getElementById('actionFilter').addEventListener('keydown', e => { if(e.key==='Enter') loadAudit(1); });
document.getElementById('userFilter').addEventListener('keydown', e => { if(e.key==='Enter') loadAudit(1); });

loadAudit(1);
</script>
</body>
</html>
