<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courra-Sec - Alerts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,#0d0d1a 0%,#111827 100%);color:#e5e7eb;min-height:100vh;font-family:'Segoe UI',sans-serif;}
        .navbar{background:#0a0a14!important;border-bottom:1px solid rgba(99,102,241,.25);}
        .nav-link{color:rgba(255,255,255,.65)!important;font-size:.85rem;}
        .nav-link:hover,.nav-link.active{color:#a78bfa!important;}
        .g-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;margin-bottom:20px;}

        .sev{padding:2px 8px;border-radius:99px;font-size:.68rem;font-weight:600;display:inline-block;}
        .sev-critical{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4);}
        .sev-high{background:rgba(249,115,22,.2);color:#fdba74;border:1px solid rgba(249,115,22,.4);}
        .sev-medium{background:rgba(234,179,8,.2);color:#fde68a;border:1px solid rgba(234,179,8,.4);}
        .sev-low{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4);}
        .sev-info{background:rgba(107,114,128,.2);color:#9ca3af;border:1px solid rgba(107,114,128,.4);}

        .alert-card{border-radius:12px;padding:16px;margin-bottom:12px;border-left:4px solid transparent;transition:.2s;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);}
        .alert-card:hover{background:rgba(255,255,255,.05);}
        .alert-card.unread{background:rgba(99,102,241,.04);}
        .alert-card.al-critical{border-left-color:#ef4444;}
        .alert-card.al-high{border-left-color:#f97316;}
        .alert-card.al-medium{border-left-color:#eab308;}
        .alert-card.al-low{border-left-color:#22c55e;}
        .alert-card.al-info{border-left-color:#6b7280;}
        .alert-card.read{opacity:.55;}

        .risk-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px;}
        .risk-bar-fill{height:100%;border-radius:99px;}

        .ml-tag{font-size:.63rem;padding:1px 6px;border-radius:99px;margin-right:3px;margin-bottom:2px;display:inline-block;}
        .ml-anomaly{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}
        .ml-ueba{background:rgba(168,85,247,.15);color:#d8b4fe;border:1px solid rgba(168,85,247,.3);}
        .ml-lstm{background:rgba(59,130,246,.15);color:#93c5fd;border:1px solid rgba(59,130,246,.3);}
        .ml-novel{background:rgba(234,179,8,.15);color:#fde68a;border:1px solid rgba(234,179,8,.3);}
        .ml-chain{background:rgba(239,68,68,.25);color:#fca5a5;border:1px solid rgba(239,68,68,.5);}
        .ml-mitre{background:rgba(99,102,241,.15);color:#c7d2fe;border:1px solid rgba(99,102,241,.3);}

        .risk-score-badge{font-size:.8rem;font-weight:700;padding:4px 10px;border-radius:8px;display:inline-block;}
        .rsb-critical{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4);}
        .rsb-high{background:rgba(249,115,22,.15);color:#fdba74;border:1px solid rgba(249,115,22,.4);}
        .rsb-medium{background:rgba(234,179,8,.15);color:#fde68a;border:1px solid rgba(234,179,8,.4);}
        .rsb-low{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.4);}
        .rsb-info{background:rgba(107,114,128,.15);color:#9ca3af;border:1px solid rgba(107,114,128,.4);}

        .sec-head{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#6b7280;margin-bottom:10px;font-weight:600;}
        .stat-num{font-size:2rem;font-weight:700;line-height:1;}
        code{color:#a78bfa;background:rgba(167,139,250,.1);padding:1px 5px;border-radius:4px;font-size:.78rem;}
        .live-badge{animation:pulse 2s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
        .form-select,.form-control{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;color:#e5e7eb!important;font-size:.82rem;}
        .form-select option{background:#1f2937;}
    </style>
</head>
<body>
<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/"><i class="fas fa-shield-alt me-2" style="color:#a78bfa"></i>COURRA-SEC SIEM <span class="badge ms-1" style="background:#1e1b4b;color:#a78bfa;font-size:.62rem">v2.0</span><span class="badge bg-success ms-1 live-badge" style="font-size:.62rem">LIVE</span></a>
        <div class="navbar-nav flex-row align-items-center ms-auto gap-1">
            <span class="text-secondary me-2" style="font-size:.8rem"><i class="fas fa-user-circle me-1"></i>{{ username }}</span>
            <a class="nav-link px-2" href="/dashboard">Dashboard</a>
            <a class="nav-link px-2" href="/logs">Logs</a>
            <a class="nav-link px-2" href="/attacks">Attacks</a>
            <a class="nav-link active px-2" href="/alerts">Alerts</a>
            <a class="nav-link px-2" href="/blocklist">Blocklist</a>
            <a class="nav-link px-2" href="/rules"><i class="fas fa-sliders-h me-1"></i>Rules</a>
            <a class="nav-link px-2" href="/sdk"><i class="fas fa-code me-1"></i>SDK</a>
            <a class="nav-link px-2 text-warning" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container-fluid py-4 px-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h4 mb-0">Security Alerts</h1>
            <p class="text-secondary mb-0" style="font-size:.8rem">ML-generated alerts show risk score, MITRE tactic, signal breakdown and attack chains</p>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadAlerts()"><i class="fas fa-sync-alt me-1"></i>Refresh</button>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-3">
        <div class="col-6 col-md-3"><div class="g-card text-center"><div class="stat-num text-danger"  id="critCount">—</div><div class="sec-head mt-1 mb-0">Critical</div></div></div>
        <div class="col-6 col-md-3"><div class="g-card text-center"><div class="stat-num text-warning" id="unreadCount">—</div><div class="sec-head mt-1 mb-0">Unread</div></div></div>
        <div class="col-6 col-md-3"><div class="g-card text-center"><div class="stat-num" style="color:#a78bfa" id="mlAlertCount">—</div><div class="sec-head mt-1 mb-0">ML-Generated</div></div></div>
        <div class="col-6 col-md-3"><div class="g-card text-center"><div class="stat-num text-secondary" id="totalCount">—</div><div class="sec-head mt-1 mb-0">Total</div></div></div>
    </div>

    <!-- Filters -->
    <div class="g-card py-3 px-4 mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-6 col-md-2">
                <label class="sec-head d-block">Severity</label>
                <select class="form-select form-select-sm" id="sevFilter">
                    <option value="">All</option>
                    <option value="critical">Critical</option>
                    <option value="high">High</option>
                    <option value="medium">Medium</option>
                    <option value="low">Low</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="sec-head d-block">Source</label>
                <select class="form-select form-select-sm" id="srcFilter">
                    <option value="">All</option>
                    <option value="ml">ML-Generated</option>
                    <option value="rule">Rule-Based</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="sec-head d-block">Status</label>
                <select class="form-select form-select-sm" id="statusFilter">
                    <option value="">All</option>
                    <option value="unread">Unread</option>
                    <option value="ack">Acknowledged</option>
                </select>
            </div>
            <div class="col-6 col-md-3">
                <label class="sec-head d-block">Type / search</label>
                <input type="text" class="form-control form-control-sm" id="typeFilter" placeholder="e.g. bruteforce">
            </div>
            <div class="col-12 col-md-3 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-fill" onclick="applyFilters()"><i class="fas fa-filter me-1"></i>Filter</button>
                <button class="btn btn-sm btn-outline-secondary" onclick="clearFilters()">Clear</button>
            </div>
        </div>
    </div>

    <!-- Alert list -->
    <div id="alertsContainer"><div class="text-center py-5 text-secondary"><div class="spinner-border spinner-border-sm me-2"></div>Loading…</div></div>
</div>

<!-- Alert detail modal -->
<div class="modal fade" id="alertModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content" style="background:#111827;color:#e5e7eb;border:1px solid rgba(255,255,255,.1)">
            <div class="modal-header" style="border-color:rgba(255,255,255,.1)">
                <h5 class="modal-title"><i class="fas fa-bell me-2" style="color:#a78bfa"></i>Alert + ML Analysis</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="alertModalBody"></div>
            <div class="modal-footer" style="border-color:rgba(255,255,255,.1)">
                <button class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button class="btn btn-sm btn-success" id="alertAckBtn"><i class="fas fa-check me-1"></i>Acknowledge</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allAlerts=[], filteredAlerts=[];

function rc(s){return s>=80?'critical':s>=60?'high':s>=40?'medium':s>=20?'low':'info';}
function bc(c){return c==='critical'?'#ef4444':c==='high'?'#f97316':c==='medium'?'#eab308':'#22c55e';}

function buildTags(det) {
    const tags=[];
    if (!det) return '';
    const flags = det.flags||[];
    if (flags.includes('anomaly'))            tags.push('<span class="ml-tag ml-anomaly">anomaly</span>');
    if (flags.includes('UEBA'))               tags.push('<span class="ml-tag ml-ueba">UEBA</span>');
    if (flags.includes('sequential-pattern')) tags.push('<span class="ml-tag ml-lstm">LSTM</span>');
    if (flags.includes('novel-log'))          tags.push('<span class="ml-tag ml-novel">novel</span>');
    (det.chains||[]).forEach(c=>tags.push(`<span class="ml-tag ml-chain">[chain]${c}</span>`));
    if (det.mitre_tactic && det.mitre_tactic!=='N/A') tags.push(`<span class="ml-tag ml-mitre">${det.mitre_tactic.split(' ')[0]}</span>`);
    return tags.join('');
}

async function loadAlerts() {
    try {
        const res = await fetch('/api/alerts');
        allAlerts = await res.json();

        const today = new Date().toDateString();
        const mlAlerts = allAlerts.filter(a=>(a.alert_type||'').startsWith('ML:'));
        document.getElementById('critCount').textContent    = allAlerts.filter(a=>a.severity==='critical').length;
        document.getElementById('unreadCount').textContent  = allAlerts.filter(a=>!a.is_read).length;
        document.getElementById('mlAlertCount').textContent = mlAlerts.length;
        document.getElementById('totalCount').textContent   = allAlerts.length;

        applyFilters();
    } catch(e) {
        document.getElementById('alertsContainer').innerHTML=`<div class="text-danger text-center py-4">Error: ${e.message}</div>`;
    }
}

function applyFilters() {
    const sev    = document.getElementById('sevFilter').value;
    const src    = document.getElementById('srcFilter').value;
    const status = document.getElementById('statusFilter').value;
    const type   = document.getElementById('typeFilter').value.toLowerCase();

    filteredAlerts = allAlerts.filter(a => {
        if (sev && a.severity !== sev) return false;
        if (src==='ml'   && !(a.alert_type||'').startsWith('ML:')) return false;
        if (src==='rule' &&  (a.alert_type||'').startsWith('ML:')) return false;
        if (status==='unread' && a.is_read) return false;
        if (status==='ack' && !a.acknowledged) return false;
        if (type && !(a.message||'').toLowerCase().includes(type) && !(a.alert_type||'').toLowerCase().includes(type)) return false;
        return true;
    }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));

    renderAlerts();
}

function clearFilters() {
    ['sevFilter','srcFilter','statusFilter','typeFilter'].forEach(id=>document.getElementById(id).value='');
    applyFilters();
}

function renderAlerts() {
    if (!filteredAlerts.length) {
        document.getElementById('alertsContainer').innerHTML=`
        <div class="text-center py-5 text-secondary">
            <i class="fas fa-bell-slash fa-3x mb-3 d-block" style="opacity:.3"></i>
            <h5>No alerts match your filters</h5>
        </div>`;
        return;
    }

    document.getElementById('alertsContainer').innerHTML = filteredAlerts.map(a => {
        let det={}; try{det=JSON.parse(a.details||'{}');}catch(e){}
        const rs   = det.risk_score||null;
        const isML = (a.alert_type||'').startsWith('ML:');
        const tags = buildTags(det);
        const bar  = rs!==null ? `<div class="risk-bar"><div class="risk-bar-fill" style="width:${rs}%;background:${bc(rc(rs))}"></div></div>` : '';

        return `
        <div class="alert-card al-${a.severity} ${!a.is_read?'unread':''} ${a.is_read?'read':''}" onclick="viewAlert(${a.id})" style="cursor:pointer">
            <div class="d-flex justify-content-between align-items-start gap-3">
                <div class="flex-fill">
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-1">
                        <span class="fw-bold" style="font-size:.88rem">${a.message.substring(0,80)}${a.message.length>80?'…':''}</span>
                        <span class="sev sev-${a.severity}">${a.severity}</span>
                        ${isML ? '<span style="font-size:.62rem;color:#a78bfa;border:1px solid rgba(167,139,250,.4);padding:1px 5px;border-radius:4px">ML</span>' : ''}
                        ${a.acknowledged ? '<span style="font-size:.62rem;color:#86efac;border:1px solid rgba(34,197,94,.4);padding:1px 5px;border-radius:4px">Acked</span>' : ''}
                    </div>
                    <div style="font-size:.75rem;color:#9ca3af" class="mb-1">
                        <i class="fas fa-tag me-1"></i>${a.alert_type||'N/A'}
                        ${det.source_ip?` &nbsp;·&nbsp; <code>${det.source_ip}</code>`:''}
                        ${rs!==null?` &nbsp;·&nbsp; <span class="rsb-${rc(rs)} risk-score-badge">Risk ${rs}</span>`:''}
                        ${det.mitre_tactic && det.mitre_tactic!=='N/A'?` &nbsp;·&nbsp; <span class="ml-tag ml-mitre">${det.mitre_tactic.split(' ')[0]}</span>`:''}
                    </div>
                    ${bar}
                    ${tags ? `<div class="mt-1">${tags}</div>` : ''}
                </div>
                <div class="text-end flex-shrink-0">
                    <div style="font-size:.72rem;color:#6b7280;white-space:nowrap">${new Date(a.created_at).toLocaleString()}</div>
                    <div class="mt-2 d-flex gap-1 justify-content-end">
                        ${!a.acknowledged?`<button class="btn btn-sm btn-outline-success p-1 px-2" onclick="event.stopPropagation();ackAlert(${a.id})" style="font-size:.68rem"><i class="fas fa-check me-1"></i>Ack</button>`:''}
                        ${!a.is_read?`<button class="btn btn-sm btn-outline-secondary p-1 px-2" onclick="event.stopPropagation();markRead(${a.id})" style="font-size:.68rem">Read</button>`:''}
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');
}

function viewAlert(id) {
    const a = allAlerts.find(x=>x.id===id);
    if (!a) return;
    let det={}; try{det=JSON.parse(a.details||'{}');}catch(e){}
    const rs  = det.risk_score||null;
    const tags = buildTags(det);
    const sb  = det.signal_breakdown||null;
    const sbHTML = sb ? `<p class="sec-head mt-3">Signal Breakdown</p><div class="row g-2">${Object.entries(sb).map(([k,v])=>`<div class="col-6"><div style="font-size:.7rem;color:#9ca3af;text-transform:capitalize">${k}</div><div style="height:3px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden"><div style="height:100%;width:${v}%;background:#a78bfa"></div></div><span style="font-size:.7rem;color:#a78bfa">${v}</span></div>`).join('')}</div>` : '';

    document.getElementById('alertModalBody').innerHTML=`
    <div class="row g-3">
        <div class="col-md-5">
            <p class="sec-head">Alert Info</p>
            <div class="mb-2"><span class="sev sev-${a.severity} me-2">${a.severity}</span>${(a.alert_type||'').startsWith('ML:')?'<span style="font-size:.7rem;color:#a78bfa;border:1px solid rgba(167,139,250,.4);padding:1px 6px;border-radius:4px">ML-Generated</span>':''}</div>
            <p style="font-size:.85rem">${a.message}</p>
            <table class="table table-sm" style="color:#e5e7eb;font-size:.8rem">
                <tr><td class="text-secondary">Type</td><td>${a.alert_type}</td></tr>
                <tr><td class="text-secondary">Created</td><td>${new Date(a.created_at).toLocaleString()}</td></tr>
                <tr><td class="text-secondary">Status</td><td>${a.acknowledged?'<span style="color:#86efac">Acknowledged</span>':'<span style="color:#9ca3af">Pending</span>'} &nbsp; ${a.is_read?'Read':'Unread'}</td></tr>
                ${det.source_ip?`<tr><td class="text-secondary">Source IP</td><td><code>${det.source_ip}</code></td></tr>`:''}
            </table>
        </div>
        <div class="col-md-7">
            <p class="sec-head">ML Intelligence</p>
            ${rs!==null?`
            <div class="d-flex align-items-center gap-3 mb-3">
                <div style="font-size:2.2rem;font-weight:700;color:${bc(rc(rs))}">${rs}<span style="font-size:.9rem;color:#6b7280">/100</span></div>
                <div>
                    <div style="font-size:.85rem;font-weight:700;color:${bc(rc(rs))}">${rc(rs).toUpperCase()} RISK</div>
                    ${det.threat_label?`<div style="font-size:.78rem;color:#a78bfa">${det.threat_label}</div>`:''}
                    ${det.mitre_tactic&&det.mitre_tactic!=='N/A'?`<div style="font-size:.72rem;color:#818cf8">${det.mitre_tactic}</div>`:''}
                </div>
            </div>`:'<p class="text-secondary small">No ML score — rule-based alert.</p>'}
            <div class="mb-2">${tags||'<span class="text-secondary small">No ML flags</span>'}</div>
            ${(det.chains||[]).length?`<p class="sec-head mt-2">Attack Chains</p>${det.chains.map(c=>`<div class="mb-1 small">[chain]${c}</div>`).join('')}`:''}
            ${sbHTML}
        </div>
    </div>`;

    document.getElementById('alertAckBtn').onclick = async () => {
        await ackAlert(a.id);
        bootstrap.Modal.getInstance(document.getElementById('alertModal')).hide();
    };
    new bootstrap.Modal(document.getElementById('alertModal')).show();
}

async function ackAlert(id) {
    await fetch(`/api/acknowledge_alert/${id}`,{method:'POST'});
    loadAlerts();
}

async function markRead(id) {
    await fetch(`/api/mark_read/${id}`,{method:'POST'});
    loadAlerts();
}

function rc(s){return s>=80?'critical':s>=60?'high':s>=40?'medium':s>=20?'low':'info';}
function bc(c){return c==='critical'?'#ef4444':c==='high'?'#f97316':c==='medium'?'#eab308':'#22c55e';}

setInterval(loadAlerts, 30000);
loadAlerts();
</script>
</body>
</html>
