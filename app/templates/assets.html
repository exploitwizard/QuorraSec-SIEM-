<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">
<script>(function(){var _f=window.fetch;window.fetch=function(u,o){o=o||{};if(o.method&&o.method.toUpperCase()!="GET"){o.headers=o.headers||{};var m=document.querySelector('meta[name="csrf-token"]');if(m&&m.content)o.headers["X-CSRF-Token"]=m.content;}return _f.call(this,u,o);};})();</script>
<title>Courra-Sec — Asset Inventory</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0d0d1a 0%,#111827 100%);color:#e5e7eb;min-height:100vh;font-family:'Segoe UI',sans-serif;}
.navbar{background:#0a0a14!important;border-bottom:1px solid rgba(99,102,241,.25);}
.nav-link{color:rgba(255,255,255,.65)!important;font-size:.85rem;}.nav-link:hover,.nav-link.active{color:#a78bfa!important;}
.g-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:20px;margin-bottom:16px;}
.sec-head{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:#6b7280;margin-bottom:6px;font-weight:600;}
.form-control,.form-select{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.12)!important;color:#e5e7eb!important;font-size:.82rem;}
.form-select option{background:#1f2937;}
.crit{padding:2px 8px;border-radius:99px;font-size:.65rem;font-weight:700;}
.crit-critical{background:rgba(239,68,68,.2);color:#fca5a5;border:1px solid rgba(239,68,68,.4);}
.crit-high{background:rgba(249,115,22,.2);color:#fdba74;border:1px solid rgba(249,115,22,.4);}
.crit-medium{background:rgba(234,179,8,.2);color:#fde68a;border:1px solid rgba(234,179,8,.4);}
.crit-low{background:rgba(34,197,94,.2);color:#86efac;border:1px solid rgba(34,197,94,.4);}
.atype-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
</style>
</head>
<body>
<nav class="navbar navbar-dark">
<div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/"><i class="fas fa-shield-alt me-2" style="color:#a78bfa"></i>COURRA-SEC SIEM</a>
    <div class="navbar-nav flex-row align-items-center ms-auto gap-1">
        <span class="text-secondary me-2" style="font-size:.8rem"><i class="fas fa-user-circle me-1"></i>{{ username }}</span>
        <a class="nav-link px-2" href="/dashboard">Dashboard</a>
        <a class="nav-link active px-2" href="/assets"><i class="fas fa-server me-1"></i>Assets</a>
        <a class="nav-link px-2" href="/cases">Cases</a>
        <a class="nav-link px-2 text-warning" href="/logout">Logout</a>
    </div>
</div>
</nav>

<div class="container-fluid py-4 px-4">
<div class="d-flex justify-content-between align-items-center mb-3">
    <div>
        <h1 class="h4 mb-0"><i class="fas fa-server me-2" style="color:#06b6d4"></i>Asset Inventory</h1>
        <p class="text-secondary mb-0" style="font-size:.8rem">Track hosts, devices, and their security posture</p>
    </div>
    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#newModal"><i class="fas fa-plus me-1"></i>Add Asset</button>
</div>

<!-- Stats -->
<div class="row g-3 mb-3">
    <div class="col-6 col-md-3"><div class="g-card text-center"><div class="h3 mb-0 text-danger" id="critCount">—</div><div class="sec-head mt-1 mb-0">Critical</div></div></div>
    <div class="col-6 col-md-3"><div class="g-card text-center"><div class="h3 mb-0" style="color:#f97316" id="highCount">—</div><div class="sec-head mt-1 mb-0">High</div></div></div>
    <div class="col-6 col-md-3"><div class="g-card text-center"><div class="h3 mb-0 text-secondary" id="totalCount">—</div><div class="sec-head mt-1 mb-0">Total</div></div></div>
    <div class="col-6 col-md-3"><div class="g-card text-center">
        <select class="form-select form-select-sm" id="typeFilter" onchange="loadAssets()">
            <option value="">All Types</option>
            <option value="server">Server</option>
            <option value="workstation">Workstation</option>
            <option value="network">Network</option>
            <option value="cloud">Cloud</option>
            <option value="mobile">Mobile</option>
        </select>
    </div></div>
</div>

<div class="g-card" style="padding:0;overflow:hidden">
<table class="table table-sm mb-0" style="font-size:.8rem">
<thead style="background:rgba(255,255,255,.04)"><tr class="text-secondary">
    <th class="px-3 py-2">Host</th><th>IP</th><th>Type</th><th>OS</th><th>Owner</th><th>Criticality</th><th>Last Seen</th><th></th>
</tr></thead>
<tbody id="assetsTbody">
    <tr><td colspan="8" class="text-center py-4 text-secondary"><div class="spinner-border spinner-border-sm"></div></td></tr>
</tbody>
</table>
</div>
</div>

<!-- Add asset modal -->
<div class="modal fade" id="newModal" tabindex="-1">
<div class="modal-dialog modal-lg"><div class="modal-content" style="background:#111827;color:#e5e7eb;border:1px solid rgba(255,255,255,.1)">
    <div class="modal-header" style="border-color:rgba(255,255,255,.1)">
        <h5 class="modal-title"><i class="fas fa-plus me-2" style="color:#06b6d4"></i>Add Asset</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <div class="row g-3">
            <div class="col-6"><label class="sec-head">Hostname</label><input type="text" class="form-control" id="aHostname" placeholder="server01.corp.local"></div>
            <div class="col-6"><label class="sec-head">IP Address</label><input type="text" class="form-control" id="aIP" placeholder="192.168.1.100"></div>
            <div class="col-4"><label class="sec-head">Type</label>
                <select class="form-select" id="aType">
                    <option value="server">Server</option><option value="workstation">Workstation</option>
                    <option value="network">Network Device</option><option value="cloud">Cloud</option><option value="mobile">Mobile</option>
                </select>
            </div>
            <div class="col-4"><label class="sec-head">Criticality</label>
                <select class="form-select" id="aCrit">
                    <option value="critical">Critical</option><option value="high">High</option>
                    <option value="medium" selected>Medium</option><option value="low">Low</option>
                </select>
            </div>
            <div class="col-4"><label class="sec-head">OS</label><input type="text" class="form-control" id="aOS" placeholder="Ubuntu 22.04"></div>
            <div class="col-6"><label class="sec-head">Owner</label><input type="text" class="form-control" id="aOwner" placeholder="ops-team"></div>
            <div class="col-6"><label class="sec-head">Department</label><input type="text" class="form-control" id="aDept" placeholder="Engineering"></div>
            <div class="col-12"><label class="sec-head">Notes</label><textarea class="form-control" id="aNotes" rows="2"></textarea></div>
        </div>
    </div>
    <div class="modal-footer" style="border-color:rgba(255,255,255,.1)">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="addAsset()">Add Asset</button>
    </div>
</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const typeIcons = {server:'fa-server',workstation:'fa-laptop',network:'fa-network-wired',cloud:'fa-cloud',mobile:'fa-mobile-alt'};
const typeColors = {server:'rgba(6,182,212,.15)',workstation:'rgba(99,102,241,.15)',network:'rgba(234,179,8,.15)',cloud:'rgba(168,85,247,.15)',mobile:'rgba(34,197,94,.15)'};

function loadAssets() {
    const t = document.getElementById('typeFilter').value;
    fetch('/api/assets' + (t?'?type='+t:'')).then(r=>r.json()).then(assets=>{
        document.getElementById('critCount').textContent  = assets.filter(a=>a.criticality==='critical').length;
        document.getElementById('highCount').textContent  = assets.filter(a=>a.criticality==='high').length;
        document.getElementById('totalCount').textContent = assets.length;

        if(!assets.length){
            document.getElementById('assetsTbody').innerHTML='<tr><td colspan="8" class="text-center py-4 text-secondary"><i class="fas fa-server fa-2x mb-2 d-block opacity-25"></i>No assets registered</td></tr>';
            return;
        }
        document.getElementById('assetsTbody').innerHTML = assets.map(a=>`
        <tr>
            <td class="px-3">
                <div class="d-flex align-items-center gap-2">
                    <div class="atype-icon" style="background:${typeColors[a.asset_type]||'rgba(255,255,255,.08)'}"><i class="fas ${typeIcons[a.asset_type]||'fa-question'}" style="color:#9ca3af"></i></div>
                    <span class="fw-semibold">${escHtml(a.hostname||'—')}</span>
                </div>
            </td>
            <td><code style="font-size:.75rem;color:#a78bfa">${escHtml(a.ip_address||'—')}</code></td>
            <td class="text-secondary">${escHtml(a.asset_type||'')}</td>
            <td class="text-secondary">${escHtml(a.os||'—')}</td>
            <td class="text-secondary">${escHtml(a.owner||'—')}</td>
            <td><span class="crit crit-${a.criticality}">${a.criticality}</span></td>
            <td class="text-secondary">${a.last_seen ? a.last_seen.substring(0,10) : '—'}</td>
            <td><button class="btn btn-sm p-0 text-danger" onclick="deleteAsset(${a.id})"><i class="fas fa-trash"></i></button></td>
        </tr>`).join('');
    });
}

function addAsset() {
    const hostname = document.getElementById('aHostname').value.trim();
    const ip = document.getElementById('aIP').value.trim();
    if(!hostname && !ip) { alert('Hostname or IP required'); return; }
    fetch('/api/assets', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            hostname, ip_address: ip,
            asset_type: document.getElementById('aType').value,
            criticality: document.getElementById('aCrit').value,
            os: document.getElementById('aOS').value,
            owner: document.getElementById('aOwner').value,
            department: document.getElementById('aDept').value,
            notes: document.getElementById('aNotes').value,
        })
    }).then(r=>r.json()).then(d=>{
        if(d.ok){ bootstrap.Modal.getInstance(document.getElementById('newModal')).hide(); loadAssets(); }
        else alert(d.error);
    });
}

function deleteAsset(id) {
    if(!confirm('Remove this asset?')) return;
    fetch(`/api/assets/${id}`, {method:'DELETE'}).then(()=>loadAssets());
}

loadAssets();
</script>
</body>
</html>
