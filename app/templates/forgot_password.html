<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Courra-Sec SIEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .forgot-card {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        .brand-header { text-align: center; margin-bottom: 2rem; }
        .brand-header h1 { color: #818cf8; font-size: 1.6rem; font-weight: 700; margin: 0; }
        .brand-header p  { color: #8b949e; font-size: 0.85rem; margin: 4px 0 0; }
        .form-label { color: rgba(255,255,255,.8); font-size: 0.9rem; }
        .form-control {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            color: #fff;
            border-radius: 8px;
        }
        .form-control:focus {
            background: rgba(255,255,255,.12);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(99,102,241,.25);
        }
        .form-control::placeholder { color: rgba(255,255,255,.3); }
        .btn-submit {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            width: 100%;
            font-size: 1rem;
        }
        .btn-submit:hover { opacity: 0.9; color: #fff; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        #successMsg {
            display: none;
            background: rgba(16,185,129,.12);
            border: 1px solid rgba(16,185,129,.3);
            border-left: 3px solid #34d399;
            border-radius: 6px;
            color: #6ee7b7;
            padding: 0.85rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="forgot-card">
        <div class="brand-header">
            <div style="font-size:2.4rem;margin-bottom:6px;">🛡️</div>
            <h1>Courra-Sec SIEM</h1>
            <p>Security Information &amp; Event Management</p>
        </div>

        <h2 style="color:#e2e8f0;font-size:1.15rem;font-weight:600;margin-bottom:0.3rem;">Forgot your password?</h2>
        <p style="color:#64748b;font-size:0.88rem;margin-bottom:1.5rem;">
            Enter your account email and we'll send you a reset link.
        </p>

        <div id="successMsg">
            <i class="fas fa-check-circle me-2"></i>
            If that email exists in our system, a password reset link has been sent.
        </div>

        <div id="formArea">
            <div class="mb-3">
                <label for="emailInput" class="form-label">
                    <i class="fas fa-envelope me-1"></i> Email address
                </label>
                <input type="email" class="form-control" id="emailInput"
                       placeholder="you@example.com" autocomplete="email" autofocus>
            </div>
            <button type="button" class="btn btn-submit" id="submitBtn" onclick="submitReset()">
                <i class="fas fa-paper-plane me-2"></i>Send Reset Link
            </button>
        </div>

        <div class="text-center mt-4">
            <a href="{{ url_for('login') }}" style="color:#818cf8;font-size:0.85rem;text-decoration:none;">
                <i class="fas fa-arrow-left me-1"></i>Back to Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function submitReset() {
            const email = document.getElementById('emailInput').value.trim();
            const btn   = document.getElementById('submitBtn');
            if (!email) { document.getElementById('emailInput').focus(); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending…';

            try {
                await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email}),
                });
            } catch (_) {}

            document.getElementById('formArea').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        }

        document.getElementById('emailInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitReset();
        });
    </script>
</body>
</html>
