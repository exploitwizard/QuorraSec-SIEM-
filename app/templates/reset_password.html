<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Courra-Sec SIEM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-card {
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
        }
        .brand-header { text-align: center; margin-bottom: 2rem; }
        .brand-header h1 { color: #818cf8; font-size: 1.6rem; font-weight: 700; margin: 0; }
        .brand-header p  { color: #8b949e; font-size: 0.85rem; margin: 4px 0 0; }
        .form-label { color: rgba(255,255,255,.8); font-size: 0.9rem; }
        .form-control {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            color: #fff;
            border-radius: 8px;
        }
        .form-control:focus {
            background: rgba(255,255,255,.12);
            border-color: #6366f1;
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(99,102,241,.25);
        }
        .form-control::placeholder { color: rgba(255,255,255,.3); }
        .btn-reset {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem;
            width: 100%;
            font-size: 1rem;
        }
        .btn-reset:hover { opacity: 0.9; color: #fff; }
        .alert-error {
            background: rgba(248,81,73,.1);
            border: 1px solid rgba(248,81,73,.3);
            border-left: 3px solid #f85149;
            border-radius: 6px;
            color: #f85149;
            padding: 0.8rem 1rem;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
        }
        /* Password strength bar */
        #strengthBar {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: width .3s, background .3s;
            width: 0;
        }
        #strengthLabel {
            font-size: 0.75rem;
            margin-top: 3px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="brand-header">
            <div style="font-size:2.4rem;margin-bottom:6px;">🛡️</div>
            <h1>Courra-Sec SIEM</h1>
            <p>Security Information &amp; Event Management</p>
        </div>

        <h2 style="color:#e2e8f0;font-size:1.15rem;font-weight:600;margin-bottom:0.3rem;">Set a new password</h2>
        <p style="color:#64748b;font-size:0.88rem;margin-bottom:1.5rem;">
            Choose a strong password of at least 8 characters.
        </p>

        {% if error %}
        <div class="alert-error">
            <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="mb-3">
                <label for="new_password" class="form-label">
                    <i class="fas fa-lock me-1"></i> New Password
                </label>
                <div style="position:relative;">
                    <input type="password" class="form-control" id="new_password" name="new_password"
                           placeholder="Minimum 8 characters" required autocomplete="new-password"
                           oninput="checkStrength(this.value)">
                    <span onclick="togglePw('new_password', this)"
                          style="position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,.4);">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div id="strengthBar"></div>
                <div id="strengthLabel"></div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label">
                    <i class="fas fa-lock me-1"></i> Confirm New Password
                </label>
                <div style="position:relative;">
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Repeat password" required autocomplete="new-password">
                    <span onclick="togglePw('confirm_password', this)"
                          style="position:absolute;right:13px;top:50%;transform:translateY(-50%);cursor:pointer;color:rgba(255,255,255,.4);">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
            </div>

            <button type="submit" class="btn btn-reset">
                <i class="fas fa-key me-2"></i>Reset Password
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('login') }}" style="color:#818cf8;font-size:0.85rem;text-decoration:none;">
                <i class="fas fa-arrow-left me-1"></i>Back to Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePw(id, icon) {
            const inp = document.getElementById(id);
            const i   = icon.querySelector('i');
            if (inp.type === 'password') {
                inp.type = 'text';
                i.className = 'fas fa-eye-slash';
            } else {
                inp.type = 'password';
                i.className = 'fas fa-eye';
            }
        }

        function checkStrength(pw) {
            const bar   = document.getElementById('strengthBar');
            const label = document.getElementById('strengthLabel');
            let score = 0;
            if (pw.length >= 8)  score++;
            if (pw.length >= 12) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const levels = [
                {w:'20%',  color:'#ef4444', text:'Weak'},
                {w:'40%',  color:'#f97316', text:'Fair'},
                {w:'60%',  color:'#eab308', text:'Moderate'},
                {w:'80%',  color:'#22c55e', text:'Strong'},
                {w:'100%', color:'#10b981', text:'Very strong'},
            ];
            const lvl = levels[Math.min(score, 4)];
            bar.style.width     = pw.length ? lvl.w : '0';
            bar.style.background = lvl.color;
            label.style.color   = lvl.color;
            label.textContent   = pw.length ? lvl.text : '';
        }
    </script>
</body>
</html>
