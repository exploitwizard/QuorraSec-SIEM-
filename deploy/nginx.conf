server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_types text/plain application/json application/javascript text/css text/xml;
    gzip_min_length 1024;

    # Security headers
    add_header X-Frame-Options         DENY               always;
    add_header X-Content-Type-Options  nosniff            always;
    add_header X-XSS-Protection        "1; mode=block"    always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Static assets — serve directly and cache
    location /static/ {
        alias /home/ubuntu/courra-sec/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SDK file — served with CORS so any site can include it
    location /courra-sec-sdk.js {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header         Access-Control-Allow-Origin "*";
        add_header         Cache-Control "public, max-age=3600";
    }

    # /ingest — wide-open CORS for SDK telemetry
    location /ingest {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Content-Type, X-API-Key, Authorization, ngrok-skip-browser-warning" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # WebSocket ingest — upgraded connection
    location /ws/ingest {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Everything else — proxy to Flask
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering    off;
    }
}
